name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triviet_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d triviet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables CartOrderPostgresTest, which applies every Flyway migration on a real PostgreSQL
      CART_POSTGRES_URL: jdbc:postgresql://localhost:5432/triviet_ci
      CART_POSTGRES_USER: ci
      CART_POSTGRES_PASSWORD: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: set -o pipefail; mvn -B -ntp test 2>&1 | tee mvn.log
      - name: Report failing tests
        if: failure()
        run: |
          shopt -s nullglob
          grep -E '^\[ERROR\]' mvn.log | head -n 15 | while IFS= read -r line; do echo "::error::$line"; done
          for f in target/surefire-reports/*.txt; do
            if grep -qE "(Failures|Errors): [1-9]" "$f"; then
              echo "::error title=$(basename "$f" .txt)::$(grep -m1 -E 'Tests run' "$f")"
              grep -E -A3 '<<< (FAILURE|ERROR)!' "$f" | head -n 12 | while IFS= read -r line; do echo "::error::$line"; done
            fi
          done

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
