services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-viettritutor}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-viettri}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-viettripassword}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${LOCAL_DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME:-viettri} -d ${LOCAL_DB_NAME:-viettritutor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SYSTEM_ADMIN_ID: ${SYSTEM_ADMIN_ID:-}
      APP_CLASS_CANCELLATION_CRON: "0 */1 * * * *"
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      APP_PROFILE: ${APP_PROFILE:-dev}
      PORT: ${BACKEND_PORT:-8080}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/viettritutor}
      DB_USERNAME: ${DB_USERNAME:-viettri}
      DB_PASSWORD: ${DB_PASSWORD:-viettripassword}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ bytes) in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      HEALTHCHECK_HOST: ${CONTAINER_LOOPBACK_ADDRESS:-127.0.0.1}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      APP_GG_PASSWORD: ${APP_GG_PASSWORD:-}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
      PAYMENT_MOCK_SUCCESS: ${PAYMENT_MOCK_SUCCESS:-true}
      PAYMENT_INTENT_TTL_MINUTES: ${PAYMENT_INTENT_TTL_MINUTES:-5}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-}
      VNPAY_RETURN_PATH: ${VNPAY_RETURN_PATH:-/student/checkout}
      VNPAY_SERVER_IP: ${VNPAY_SERVER_IP:-}
      VNPAY_TIMEOUT_SECONDS: ${VNPAY_TIMEOUT_SECONDS:-30}
      WALLET_TOPUP_MIN_AMOUNT: ${WALLET_TOPUP_MIN_AMOUNT:-10000}
      WALLET_TOPUP_MAX_AMOUNT: ${WALLET_TOPUP_MAX_AMOUNT:-50000000}
      WALLET_TOPUP_TTL_MINUTES: ${WALLET_TOPUP_TTL_MINUTES:-15}
      WALLET_VNPAY_RETURN_PATH: ${WALLET_VNPAY_RETURN_PATH:-/student/wallet}
      # An empty MONGODB_URI (as copied from .env.example) is an invalid connection string and stops the
      # backend from starting; ":-" also replaces an empty value. Meeting logs degrade gracefully without MongoDB.
      MONGODB_URI: ${MONGODB_URI:-mongodb://localhost:27017/triviettutor}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-triviettutor}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:${BACKEND_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null \"http://$$HEALTHCHECK_HOST:$$SERVER_PORT/api-docs\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_OAUTH2_BASE_URL: ${VITE_OAUTH2_BASE_URL:-http://localhost:8080}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: http://${BACKEND_HOST:-backend}:${BACKEND_PORT:-8080}
      VITE_DEV_SERVER_HOST: ${CONTAINER_BIND_ADDRESS:-0.0.0.0}
      VITE_DEV_SERVER_PORT: ${FRONTEND_PORT:-5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_PREVIEW: "false"
      HEALTHCHECK_HOST: ${CONTAINER_LOOPBACK_ADDRESS:-127.0.0.1}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://' + process.env.HEALTHCHECK_HOST + ':' + process.env.VITE_DEV_SERVER_PORT)
          .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:

