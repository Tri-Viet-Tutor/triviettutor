server:
  port: 8080

spring:
  application:
    name: viettritutor-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# API documentation config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# App-level settings
app:
  jwt:
    expiration-ms: 86400000  # 24 hours
