server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: viettritutor-backend
  profiles:
    active: supabase #${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# API documentation config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# App-level settings
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    expiration-ms: 86400000  # 24 hours
