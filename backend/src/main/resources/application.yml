server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: viettritutor-backend
  servlet:
    multipart:
      # Support audio voice recordings up to 50 MB; avatars keep their own 2 MB limit in AvatarServiceImpl.
      max-file-size: 50MB
      max-request-size: 55MB
  profiles:
    active: ${APP_PROFILE:dev}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${APP_GG_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/triviettutor}
      database: ${MONGODB_DATABASE:triviettutor}
  jpa:
    open-in-view: false
    # Hibernate detects the dialect from the connection; application-supabase.yml pins PostgreSQL explicitly.
    properties:
      hibernate:
        format_sql: true

# API documentation config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# App-level settings
app:
  meetings:
    recording-dir: ${RECORDING_DIR:uploads/recordings}
  mongodb:
    # Meeting audit logs are optional; fail fast instead of blocking requests 30s when MongoDB is down.
    server-selection-timeout-ms: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:3000}
  class-cancellation:
    cron: "0 */1 * * * *"
  system:
    admin-id: ${SYSTEM_ADMIN_ID:1}
  assistant:
    # Without GEMINI_API_KEY the chatbot answers 503 ASSISTANT_UNAVAILABLE; the rest of the app still runs.
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    gemini-api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:20}
    max-output-tokens: ${ASSISTANT_MAX_OUTPUT_TOKENS:600}
    max-per-minute: ${ASSISTANT_MAX_PER_MINUTE:5}
    max-per-day: ${ASSISTANT_MAX_PER_DAY:30}
    global-max-per-day: ${ASSISTANT_GLOBAL_MAX_PER_DAY:500}
  orders:
    ttl-minutes: ${ORDER_TTL_MINUTES:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  payments:
    intent-ttl-minutes: ${PAYMENT_INTENT_TTL_MINUTES:5}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    mock-success: ${PAYMENT_MOCK_SUCCESS:true}
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:}
      api-url: ${VNPAY_API_URL:}
      return-path: ${VNPAY_RETURN_PATH:/student/checkout}
      server-ip: ${VNPAY_SERVER_IP:}
      timeout-seconds: ${VNPAY_TIMEOUT_SECONDS:30}
  wallet:
    topup-min-amount: ${WALLET_TOPUP_MIN_AMOUNT:10000}
    topup-max-amount: ${WALLET_TOPUP_MAX_AMOUNT:50000000}
    topup-ttl-minutes: ${WALLET_TOPUP_TTL_MINUTES:15}
    vnpay-return-path: ${WALLET_VNPAY_RETURN_PATH:/student/wallet}
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:7776000000} # 90 days (7776000 seconds)

# LiveKit settings
livekit:
  url: ${LIVEKIT_URL:ws://localhost:7880}
  api:
    key: ${LIVEKIT_API_KEY:devkey}
    secret: ${LIVEKIT_API_SECRET:secret}
