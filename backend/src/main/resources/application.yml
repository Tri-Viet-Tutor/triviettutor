server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: viettritutor-backend
  profiles:
    active: ${APP_PROFILE:dev}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${APP_GG_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# API documentation config
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# App-level settings
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend-url: ${FRONTEND_URL}
  payments:
    intent-ttl-minutes: ${PAYMENT_INTENT_TTL_MINUTES:15}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    mock-success: ${PAYMENT_MOCK_SUCCESS:true}
  jwt:
    expiration-ms: 86400000 # 24 hours
  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    bypass-key: ${RECAPTCHA_BYPASS_KEY:}
    enabled: ${RECAPTCHA_ENABLED:false}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}

