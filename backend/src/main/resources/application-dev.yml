spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; JPA only validates
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

# scripts/start-backend.ps1 loads the root .env into the process environment.
app:
  jwt:
    secret: ${JWT_SECRET:dev_secret_at_least_32_chars_long_!!}
    expiration-ms: 86400000

logging:
  level:
    com.viettritutor: DEBUG
    org.springframework.security: DEBUG
