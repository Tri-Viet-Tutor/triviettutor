spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; JPA only validates
    show-sql: true
  flyway:
    enabled: true
    # Set FLYWAY_LOCATIONS=classpath:db/migration in .env to stop re-seeding the classpath:data sample data
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:data}
    baseline-on-migrate: true
    validate-on-migrate: false
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders keep dev startable without Google credentials (Spring rejects an
            # empty client-id). Google login only works once the real values are set in .env.
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

# scripts/start-backend.ps1 loads the root .env into the process environment.
app:
  jwt:
    secret: ${JWT_SECRET:dev_secret_at_least_32_chars_long_!!}
    expiration-ms: ${JWT_EXPIRATION_MS:7776000000} # 90 days (7776000 seconds)

logging:
  level:
    com.viettritutor: DEBUG
    org.springframework.security: DEBUG
