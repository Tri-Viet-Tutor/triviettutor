spring:
  datasource:
    # Copy the exact host/port/user from Supabase Connect. Session mode supports
    # IPv4; direct connections support IPv6. Keep credentials outside Git.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:100}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      data-source-properties:
        sslmode: ${DB_SSL_MODE:require}
        ApplicationName: viettritutor-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${APP_GG_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  flyway:
    # Apply shared migrations explicitly with scripts/migrate-database.ps1.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.viettritutor: INFO
    org.springframework.security: INFO
